[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.20"
optimizer = true
optimizer_runs = 200
remappings = [
    # 使用同一套 OpenZeppelin v5.0.2 库，基础合约与 upgradeable 合约保持版本一致
    "@openzeppelin/contracts/=lib/openzeppelin-contracts-upgradeable/lib/openzeppelin-contracts/contracts/",
    "@openzeppelin/contracts-upgradeable/=lib/openzeppelin-contracts-upgradeable/contracts/"
]

[rpc_endpoints]
# 默认指向 Kurtosis CDK L2（proxyd-001），可按需覆盖 ETH_RPC_URL
l2 = "http://127.0.0.1:32824"

